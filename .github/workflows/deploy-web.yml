# Runs tests and builds the web version on every pull request (check only)
# and on every push to main (tests + build + deploy to GitHub Pages).
name: Web build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Never interrupt a running Pages deploy; superseded PR builds can be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the single-threaded web templates are needed (no special server headers).
          template_dir=~/.local/share/godot/export_templates/$(unzip -p /tmp/templates.tpz templates/version.txt)
          mkdir -p "$template_dir"
          unzip -q -j /tmp/templates.tpz 'templates/version.txt' 'templates/web_nothreads_*' -d "$template_dir"
          ls -la "$template_dir"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests (headless)
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      - name: Balance simulation runs (smoke check)
        run: ~/godot/godot --headless --path . --script res://tools/balance_sim.gd -- --runs=3

      - name: Export web version
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck
          ls -la build/web

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
